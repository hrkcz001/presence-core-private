name: packager
version: 0.3.0
manual: MANUAL.md
type: cli
description: Universal package and organ manager supporting Scoop (SFSU) on Windows and Nix on Linux
author: hrkcz001
license: Apache-2.0

entrypoint:
  windows: "organ-packager.exe"
  linux: "organ-packager"

compatibility:
  triad: ">=0.3.0"

tools:
  - name: packager_search
    description: Fast package search across Scoop/SFSU and Nix repositories
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Package name or query keyword to search
      required:
        - query

  - name: packager_list
    description: List installed packages and versions
    parameters:
      type: object
      properties:
        filter:
          type: string
          description: Optional filter pattern for package names

  - name: packager_install
    description: Install a package or new organ via Scoop or Nix
    parameters:
      type: object
      properties:
        package:
          type: string
          description: Package name to install
        backend:
          type: string
          description: "Optional backend override: 'sfsu', 'scoop', or 'nix'"
      required:
        - package

  - name: packager_uninstall
    description: Uninstall a package via Scoop or Nix
    parameters:
      type: object
      properties:
        package:
          type: string
          description: Package name to remove
      required:
        - package

  - name: packager_info
    description: Inspect package manifest and metadata
    parameters:
      type: object
      properties:
        package:
          type: string
          description: Package name to query
      required:
        - package

  - name: packager_update
    description: Check for outdated packages and update package repositories
    parameters:
      type: object
      properties:
        package:
          type: string
          description: Optional specific package to update

  - name: packager_resolve
    description: Automatically detect and resolve all missing system dependencies for a specified organ using the active system package manager (Scoop/Nix/Guix)
    parameters:
      type: object
      properties:
        organ:
          type: string
          description: Organ name to inspect and resolve missing dependencies for
      required:
        - organ

senses:
  - name: outdated_packages
    description: Senses outdated packages or available updates
    interval_seconds: 3600

slash_commands:
  - name: pkg
    description: Manage system packages and organs via sfsu/scoop/nix
    tool: packager_search
dependencies:
  system:
    - platform: windows
      binary: scoop
      optional: false
    - platform: windows
      binary: sfsu
      optional: true
    - platform: linux
      any_of: ["nix", "guix"]
      optional: false
