name: notify
version: "0.3.0"
description: "System desktop notifications on Windows (WinRT) and Linux (notify-send)"
instructions: "Desktop alert interface. Use toast to notify the user of major asynchronous events."
entrypoint: "notify.ts"
type: "typescript"
tools:
  - name: toast
    description: "Display a desktop notification toast"
    parameters:
      type: object
      properties:
        title:
          type: string
          description: "Notification title"
        message:
          type: string
          description: "Notification body"
        urgency:
          type: string
          enum: ["low", "normal", "critical"]
          description: "Urgency level"
      required: ["title", "message"]
commands:
  - name: notify
    tool: toast
    description: "Send desktop notification"
permissions:
  timeout_seconds: 15
compatibility:
  presence: "^0.3.0"
  api_version: 1
