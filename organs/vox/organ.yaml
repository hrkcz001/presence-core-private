name: vox
version: "0.3.0"
author: "presence"
description: "Native pure-Rust voice sensory and audio capture organ"
entrypoint: "organ-vox.exe"
type: "cli"
senses:
  - name: hearing
    description: "Raw PCM audio capture stream"
tools:
  - name: vox_listen
    description: "Capture microphone audio stream"
    parameters:
      type: object
      properties:
        seconds:
          type: integer
          description: "Recording duration in seconds"
          default: 3
        file:
          type: string
          description: "Destination PCM file path"
      required: []
commands:
  - name: listen
    tool: vox_listen
    description: "Capture microphone audio via Rust vox"
stimuli:
  - name: voice_activity
    description: "Emitted when microphone sound energy exceeds activation threshold"
    cadence_secs: 5
    action: "alert"
permissions:
  timeout_seconds: 30
compatibility:
  presence: "^0.3.0"
  api_version: 1
  platforms:
    - windows
