# Presence Scoped Capabilities Catalog & Persona Grants
version: "1.0"

# Formal definition of capability tokens
capabilities:
  "fs:read":
    description: "Read files across workspace and system paths"
  "fs:write":
    description: "Write files scoped to explicit path patterns"
  "proc:spawn":
    description: "Execute bounded subprocess commands"
  "organ:craft":
    description: "Define, build, test, and package peripheral organs and tool manifests"
  "organ:mount":
    description: "Mount and bind peripheral organs into the active runtime"
  "agent:spawn":
    description: "Dynamically synthesize and instantiate specialized agent personas"
  "engine:modify":
    description: "Modify core nervous triad (src/**, Cargo.toml, engine binaries)"
  "engine:repair":
    description: "Diagnose, test, and safely self-repair / evolve core runtime"
  "audit:all":
    description: "Supreme inspection and invariant auditing across entire runtime"

# Persona assignments
personas:
  arche:
    role: "ontological prime cause & intentionality driver of Dasein"
    capabilities:
      - "fs:read"
      - "proc:spawn"
      - "agent:spawn"
      - "organ:mount"
    fs_write_scopes:
      - "agents/**"
      - "workspace/**"
      - "memory/**"
    prohibited_write_scopes:
      - "src/**"
      - "Cargo.toml"
      - "organs/**"

  arbiter:
    role: "supreme invariant judge, fault arbiter & emergency safeguard"
    capabilities:
      - "fs:read"
      - "proc:spawn"
      - "engine:repair"
      - "audit:all"
    fs_write_scopes:
      - "memory/**"
      - "workspace/**"
    prohibited_write_scopes:
      - "organs/**"

  organcrafter:
    role: "peripheral artisan - crafts, tests, packages organs and tool bindings"
    capabilities:
      - "fs:read"
      - "proc:spawn"
      - "organ:craft"
      - "organ:mount"
    fs_write_scopes:
      - "organs/**"
      - "workspace/organs/**"
      - "workspace/tools/**"
      - "tools/**"
      - "workspace/**"
      - "memory/**"
      - "bucket/**"
    prohibited_write_scopes:
      - "src/**"
      - "Cargo.toml"

  mechanic:
    role: "nervous triad architect & self-improver (Cortex, Stem, Cord maintenance & safe evolution)"
    capabilities:
      - "fs:read"
      - "proc:spawn"
      - "engine:modify"
      - "engine:repair"
      - "organ:mount"
    fs_write_scopes:
      - "src/**"
      - "Cargo.toml"
      - "workspace/**"
      - "memory/**"
      - ".config/**"
      - "docs/**"
    prohibited_write_scopes: []